events {}

http {
  server {
    listen 80 default_server;
    server_name 127.0.0.1 localhost;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    ################################
    # TPF endpoints
    ################################

    location /tpf/chebi/ {
      proxy_pass proxy_pass http://ldf-chebi:3000;
    }

    location /tpf/dbpedia/ {
      proxy_pass proxy_pass http://ldf-dbpedia:3000;
    }

    location /tpf/drugbank/ {
      proxy_pass proxy_pass http://ldf-drugbank:3000;
    }

    location /tpf/geonames/ {
      proxy_pass proxy_pass http://ldf-geonames:3000;
    }

    location /tpf/jamendo/ {
      proxy_pass proxy_pass http://ldf-jamendo:3000;
    }

    location /tpf/kegg/ {
      proxy_pass proxy_pass http://ldf-kegg:3000;
    }

    location /tpf/lmdb/ {
      proxy_pass proxy_pass http://ldf-lmdb:3000;
    }

    location /tpf/nyt/ {
      proxy_pass proxy_pass http://ldf-nyt:3000;
    }

    location /tpf/sp2b/ {
      proxy_pass proxy_pass http://ldf-sp2b:3000;
    }

    location /tpf/swdfood/ {
      proxy_pass proxy_pass http://ldf-swdfood:3000;
    }

    ################################
    # brTPF endpoints
    ################################

    location /brtpf/chebi/ {
      proxy_pass proxy_pass http://ldf-chebi:3000;
    }

    location /brtpf/dbpedia/ {
      proxy_pass proxy_pass http://ldf-dbpedia:3000;
    }

    location /brtpf/drugbank/ {
      proxy_pass proxy_pass http://ldf-drugbank:3000;
    }

    location /brtpf/geonames/ {
      proxy_pass proxy_pass http://ldf-geonames:3000;
    }

    location /brtpf/jamendo/ {
      proxy_pass proxy_pass http://ldf-jamendo:3000;
    }

    location /brtpf/kegg/ {
      proxy_pass proxy_pass http://ldf-kegg:3000;
    }

    location /brtpf/lmdb/ {
      proxy_pass proxy_pass http://ldf-lmdb:3000;
    }

    location /brtpf/nyt/ {
      proxy_pass proxy_pass http://ldf-nyt:3000;
    }

    location /brtpf/sp2b/ {
      proxy_pass proxy_pass http://ldf-sp2b:3000;
    }

    location /brtpf/swdfood/ {
      proxy_pass proxy_pass http://ldf-swdfood:3000;
    }

    ################################
    # SPARQL endpoints
    ################################

    location /sparql/chebi/ {
      proxy_pass http://sparql-chebi:8890/sparql/;
    }

    location /sparql/dbpedia/ {
      proxy_pass http://sparql-dbpedia:8890/sparql/;
    }

    location /sparql/drugbank/ {
      proxy_pass http://sparql-drugbank:8890/sparql/;
    }

    location /sparql/geonames/ {
      proxy_pass http://sparql-geonames:8890/sparql/;
    }

    location /sparql/jamendo/ {
      proxy_pass http://sparql-jamendo:8890/sparql/;
    }

    location /sparql/kegg/ {
      proxy_pass http://sparql-kegg:8890/sparql/;
    }

    location /sparql/lmdb/ {
      proxy_pass http://sparql-lmdb:8890/sparql/;
    }

    location /sparql/nyt/ {
      proxy_pass http://sparql-nyt:8890/sparql/;
    }

    location /sparql/sp2b/ {
      proxy_pass http://sparql-sp2b:8890/sparql/;
    }

    location /sparql/swdfood/ {
      proxy_pass http://sparql-swdfood:8890/sparql/;
    }
  }
}
