events {}

http {
  server {
    listen 80 default_server;
    server_name 127.0.0.1 localhost;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    ################################
    # TPF endpoints
    ################################

    location /tpf/chebi/ {
      proxy_pass http://host.docker.internal:3000/chebi;
    }

    location /tpf/dbpedia/ {
      proxy_pass http://host.docker.internal:3001/dbpedia;
    }

    location /tpf/drugbank/ {
      proxy_pass http://host.docker.internal:3002/drugbank;
    }

    location /tpf/geonames/ {
      proxy_pass http://host.docker.internal:3003/geonames;
    }

    location /tpf/jamendo/ {
      proxy_pass http://host.docker.internal:3004/jamendo;
    }

    location /tpf/kegg/ {
      proxy_pass http://host.docker.internal:3005/kegg;
    }

    location /tpf/lmdb/ {
      proxy_pass http://host.docker.internal:3006/lmdb;
    }

    location /tpf/nyt/ {
      proxy_pass http://host.docker.internal:3007/nyt;
    }

    location /tpf/sp2b/ {
      proxy_pass http://host.docker.internal:3008/sp2b;
    }

    location /tpf/swdfood/ {
      proxy_pass http://host.docker.internal:3009/swdfood;
    }

    ################################
    # brTPF endpoints
    ################################

    location /brtpf/chebi/ {
      proxy_pass http://host.docker.internal:3000/chebi;
    }

    location /brtpf/dbpedia/ {
      proxy_pass http://host.docker.internal:3001/dbpedia;
    }

    location /brtpf/drugbank/ {
      proxy_pass http://host.docker.internal:3002/drugbank;
    }

    location /brtpf/geonames/ {
      proxy_pass http://host.docker.internal:3003/geonames;
    }

    location /brtpf/jamendo/ {
      proxy_pass http://host.docker.internal:3004/jamendo;
    }

    location /brtpf/kegg/ {
      proxy_pass http://host.docker.internal:3005/kegg;
    }

    location /brtpf/lmdb/ {
      proxy_pass http://host.docker.internal:3006/lmdb;
    }

    location /brtpf/nyt/ {
      proxy_pass http://host.docker.internal:3007/nyt;
    }

    location /brtpf/sp2b/ {
      proxy_pass http://host.docker.internal:3008/sp2b;
    }

    location /brtpf/swdfood/ {
      proxy_pass http://host.docker.internal:3009/swdfood;
    }

    ################################
    # SPARQL endpoints
    ################################

    location /sparql/chebi/ {
      proxy_pass http://host.docker.internal:8890/sparql/;
    }

    location /sparql/dbpedia/ {
      proxy_pass http://host.docker.internal:8891/sparql/;
    }

    location /sparql/drugbank/ {
      proxy_pass http://host.docker.internal:8892/sparql/;
    }

    location /sparql/geonames/ {
      proxy_pass http://host.docker.internal:8893/sparql/;
    }

    location /sparql/jamendo/ {
      proxy_pass http://host.docker.internal:8894/sparql/;
    }

    location /sparql/kegg/ {
      proxy_pass http://host.docker.internal:8895/sparql/;
    }

    location /sparql/lmdb/ {
      proxy_pass http://host.docker.internal:8896/sparql/;
    }

    location /sparql/nyt/ {
      proxy_pass http://host.docker.internal:8897/sparql/;
    }

    location /sparql/sp2b/ {
      proxy_pass http://host.docker.internal:8898/sparql/;
    }

    location /sparql/swdfood/ {
      proxy_pass http://host.docker.internal:8899/sparql/;
    }
  }
}
