events {}

http {
  server {
    listen 80 default_server;
    server_name 127.0.0.1 localhost;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    ################################
    # brTPF/TPF endpoints
    ################################

    location /ldf/chebi {
      proxy_pass http://ldf-chebi:3000/chebi;
    }

    location /ldf/dbpedia {
      proxy_pass http://ldf-dbpedia:3000/dbpedia;
    }

    location /ldf/drugbank {
      proxy_pass http://ldf-drugbank:3000/drugbank;
    }

    location /ldf/geonames {
      proxy_pass http://ldf-geonames:3000/geonames;
    }

    location /ldf/jamendo {
      proxy_pass http://ldf-jamendo:3000/jamendo;
    }

    location /ldf/kegg {
      proxy_pass http://ldf-kegg:3000/kegg;
    }

    location /ldf/lmdb {
      proxy_pass http://ldf-lmdb:3000/lmdb;
    }

    location /ldf/nyt {
      proxy_pass http://ldf-nyt:3000/nyt;
    }

    location /ldf/sp2b {
      proxy_pass http://ldf-sp2b:3000/sp2b;
    }

    location /ldf/swdfood {
      proxy_pass http://ldf-swdfood:3000/swdfood;
    }

    ################################
    # SPARQL endpoints
    ################################

    location /sparql/chebi/ {
      proxy_pass http://sparql-chebi:8890/sparql/;
    }

    location /sparql/dbpedia/ {
      proxy_pass http://sparql-dbpedia:8890/sparql/;
    }

    location /sparql/drugbank/ {
      proxy_pass http://sparql-drugbank:8890/sparql/;
    }

    location /sparql/geonames/ {
      proxy_pass http://sparql-geonames:8890/sparql/;
    }

    location /sparql/jamendo/ {
      proxy_pass http://sparql-jamendo:8890/sparql/;
    }

    location /sparql/kegg/ {
      proxy_pass http://sparql-kegg:8890/sparql/;
    }

    location /sparql/lmdb/ {
      proxy_pass http://sparql-lmdb:8890/sparql/;
    }

    location /sparql/nyt/ {
      proxy_pass http://sparql-nyt:8890/sparql/;
    }

    location /sparql/sp2b/ {
      proxy_pass http://sparql-sp2b:8890/sparql/;
    }

    location /sparql/swdfood/ {
      proxy_pass http://sparql-swdfood:8890/sparql/;
    }
  }
}
