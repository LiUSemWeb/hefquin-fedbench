
services:
  ldf-chebi:
    image: linkeddatafragments/server:v3.3.0
    ports:
      - "3000:3000"
    volumes:
      - ../../datasets:/datasets
      - ./ldf-configs/chebi.json:/config.json
    command: ["/config.json", "3000", "1"]

  ldf-dbpedia:
    image: linkeddatafragments/server:v3.3.0
    ports:
      - "3001:3000"
    volumes:
      - ../../datasets:/datasets
      - ./ldf-configs/dbpedia.json:/config.json
    command: ["/config.json", "3000", "1"]

  ldf-drugbank:
    image: linkeddatafragments/server:v3.3.0
    ports:
      - "3002:3000"
    volumes:
      - ../../datasets:/datasets
      - ./ldf-configs/drugbank.json:/config.json
    command: ["/config.json", "3000", "1"]

  ldf-geonames:
    image: linkeddatafragments/server:v3.3.0
    ports:
      - "3003:3000"
    volumes:
      - ../../datasets:/datasets
      - ./ldf-configs/geonames.json:/config.json
    command: ["/config.json", "3000", "1"]

  ldf-jamendo:
    image: linkeddatafragments/server:v3.3.0
    ports:
      - "3004:3000"
    volumes:
      - ../../datasets:/datasets
      - ./ldf-configs/jamendo.json:/config.json
    command: ["/config.json", "3000", "1"]

  ldf-kegg:
    image: linkeddatafragments/server:v3.3.0
    ports:
      - "3005:3000"
    volumes:
      - ../../datasets:/datasets
      - ./ldf-configs/kegg.json:/config.json
    command: ["/config.json", "3000", "1"]

  ldf-lmdb:
    image: linkeddatafragments/server:v3.3.0
    ports:
      - "3006:3000"
    volumes:
      - ../../datasets:/datasets
      - ./ldf-configs/lmdb.json:/config.json
    command: ["/config.json", "3000", "1"]

  ldf-nyt:
    image: linkeddatafragments/server:v3.3.0
    ports:
      - "3007:3000"
    volumes:
      - ../../datasets:/datasets
      - ./ldf-configs/nyt.json:/config.json
    command: ["/config.json", "3000", "1"]

  ldf-sp2b:
    image: linkeddatafragments/server:v3.3.0
    ports:
      - "3008:3000"
    volumes:
      - ../../datasets:/datasets
      - ldf-sp2b.json:/config.json
    command: ["/config.json", "3000", "1"]

  ldf-swdfood:
    image: linkeddatafragments/server:v3.3.0
    ports:
      - "3009:3000"
    volumes:
      - ../../datasets:/datasets
      - ./ldf-configs/swdfood.json:/config.json
    command: ["/config.json", "3000", "1"]

  sparql-chebi:
    image: openlink/virtuoso-opensource-7:7.2.16
    environment:
      DBA_PASSWORD: dba
      DATASET_4: "/datasets/ChEBI/combined|http://localhost/sparql/chebi"
    ports:
      - "8890:8890"
    volumes:
      - ./virtuoso.ini:/opt/virtuoso-opensource/database/virtuoso.ini
      - ../../datasets:/datasets
      - ./init.sh:/init.sh
    entrypoint: bash -lc "/init.sh & /virtuoso-entrypoint.sh"

  sparql-dbpedia:
    image: openlink/virtuoso-opensource-7:7.2.16
    environment:
      DBA_PASSWORD: dba
      DATASET_10: "/datasets/DBPedia-Subset/combined|http://localhost/sparql/dbpedia"
    ports:
      - "8891:8890"
    volumes:
      - ./virtuoso.ini:/opt/virtuoso-opensource/database/virtuoso.ini
      - ../../datasets:/datasets
      - ./init.sh:/init.sh
    entrypoint: bash -lc "/init.sh & /virtuoso-entrypoint.sh"

  sparql-drugbank:
    image: openlink/virtuoso-opensource-7:7.2.16
    environment:
      DBA_PASSWORD: dba
      DATASET_5: "/datasets/DrugBank/combined|http://localhost/sparql/drugbank"
    ports:
      - "8892:8890"
    volumes:
      - ./virtuoso.ini:/opt/virtuoso-opensource/database/virtuoso.ini
      - ../../datasets:/datasets
      - ./init.sh:/init.sh
    entrypoint: bash -lc "/init.sh & /virtuoso-entrypoint.sh"

  sparql-geonames:
    image: openlink/virtuoso-opensource-7:7.2.16
    environment:
      DBA_PASSWORD: dba
      DATASET_6: "/datasets/GeoNames/combined|http://localhost/sparql/geonames"
    ports:
      - "8893:8890"
    volumes:
      - ./virtuoso.ini:/opt/virtuoso-opensource/database/virtuoso.ini
      - ../../datasets:/datasets
      - ./init.sh:/init.sh
    entrypoint: bash -lc "/init.sh & /virtuoso-entrypoint.sh"

  sparql-jamendo:
    image: openlink/virtuoso-opensource-7:7.2.16
    environment:
      DBA_PASSWORD: dba
      DATASET_3: "/datasets/Jamendo/combined|http://localhost/sparql/jamendo"
    ports:
      - "8894:8890"
    volumes:
      - ./virtuoso.ini:/opt/virtuoso-opensource/database/virtuoso.ini
      - ../../datasets:/datasets
      - ./init.sh:/init.sh
    entrypoint: bash -lc "/init.sh & /virtuoso-entrypoint.sh"

  sparql-kegg:
    image: openlink/virtuoso-opensource-7:7.2.16
    environment:
      DBA_PASSWORD: dba
      DATASET_8: "/datasets/KEGG/combined|http://localhost/sparql/sp2b"
    ports:
      - "8895:8890"
    volumes:
      - ./virtuoso.ini:/opt/virtuoso-opensource/database/virtuoso.ini
      - ../../datasets:/datasets
      - ./init.sh:/init.sh
    entrypoint: bash -lc "/init.sh & /virtuoso-entrypoint.sh"

  sparql-lmdb:
    image: openlink/virtuoso-opensource-7:7.2.16
    environment:
      DBA_PASSWORD: dba
      DATASET_2: "/datasets/LMDB/combined|http://localhost/sparql/lmdb"
    ports:
      - "8896:8890"
    volumes:
      - ./virtuoso.ini:/opt/virtuoso-opensource/database/virtuoso.ini
      - ../../datasets:/datasets
      - ./init.sh:/init.sh
    entrypoint: bash -lc "/init.sh & /virtuoso-entrypoint.sh"

  sparql-nyt:
    image: openlink/virtuoso-opensource-7:7.2.16
    environment:
      DBA_PASSWORD: dba
      DATASET_1: "/datasets/NYT/combined|http://localhost/sparql/nyt"
    ports:
      - "8897:8890"
    volumes:
      - ./virtuoso.ini:/opt/virtuoso-opensource/database/virtuoso.ini
      - ../../datasets:/datasets
      - ./init.sh:/init.sh
    entrypoint: bash -lc "/init.sh & /virtuoso-entrypoint.sh"

  sparql-sp2b:
    image: openlink/virtuoso-opensource-7:7.2.16
    environment:
      DBA_PASSWORD: dba
      DATASET_8: "/datasets/SP2B/combined|http://localhost/sparql/sp2b"
    ports:
      - "8898:8890"
    volumes:
      - ./virtuoso.ini:/opt/virtuoso-opensource/database/virtuoso.ini
      - ../../datasets:/datasets
      - ./init.sh:/init.sh
    entrypoint: bash -lc "/init.sh & /virtuoso-entrypoint.sh"

  sparql-swdfood:
    image: openlink/virtuoso-opensource-7:7.2.16
    environment:
      DBA_PASSWORD: dba
      DATASET_9: "/datasets/SWDFood/combined|http://localhost/sparql/swdfood"
    ports:
      - "8899:8890"
    volumes:
      - ./virtuoso.ini:/opt/virtuoso-opensource/database/virtuoso.ini
      - ../../datasets:/datasets
      - ./init.sh:/init.sh
    entrypoint: bash -lc "/init.sh & /virtuoso-entrypoint.sh"

  nginx-proxy:
    image: nginx:latest
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      # TPF/brTPF
      - ldf-chebi
      - ldf-dbpedia
      - ldf-drugbank
      - ldf-geonames
      - ldf-jamendo
      - ldf-kegg
      - ldf-lmdb
      - ldf-nyt
      - ldf-sp2b
      - ldf-swdfood
      # SPARQL
      - sparql-chebi
      - sparql-dbpedia
      - sparql-drugbank
      - sparql-geonames
      - sparql-jamendo
      - sparql-kegg
      - sparql-lmdb
      - sparql-nyt
      - sparql-sp2b
      - sparql-swdfood
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro